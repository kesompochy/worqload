<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>worqload</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2230;
    --border: #2a313c;
    --text: #d6dee8;
    --text-dim: #8b95a3;
    --accent: #58a6ff;
    --running: #3fb950;
    --waiting: #d29922;
    --stopped: #8b95a3;
    --crashed: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: var(--panel-2); border: 1px solid var(--border); padding: .35rem .8rem; border-radius: 4px; cursor: pointer; }
  button:hover { background: #232b3a; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  textarea, input { background: var(--bg); border: 1px solid var(--border); padding: .4rem .5rem; border-radius: 4px; color: var(--text); width: 100%; }
  textarea { resize: vertical; min-height: 4rem; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .sidebar-header { padding: .75rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h1 { margin: 0; font-size: 1rem; letter-spacing: .04em; color: var(--text-dim); }
  .session-list { overflow-y: auto; flex: 1; }
  .session-card { padding: .75rem; border-bottom: 1px solid var(--border); cursor: pointer; }
  .session-card:hover { background: var(--panel); }
  .session-card.active { background: var(--panel-2); border-left: 3px solid var(--accent); padding-left: calc(.75rem - 3px); }
  .session-card .title { font-weight: 600; margin: 0 0 .2rem 0; word-break: break-word; }
  .session-card .meta { color: var(--text-dim); font-size: 12px; }
  .badge { display: inline-block; padding: .05rem .4rem; border-radius: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-right: .35rem; vertical-align: middle; }
  .badge-running { background: rgba(63,185,80,.15); color: var(--running); }
  .badge-waiting_human { background: rgba(210,153,34,.18); color: var(--waiting); }
  .badge-stopped { background: rgba(139,149,163,.16); color: var(--stopped); }
  .badge-crashed { background: rgba(248,81,73,.18); color: var(--crashed); }
  .detail { display: flex; flex-direction: column; min-height: 0; }
  .detail-empty { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--text-dim); }
  .detail-header { padding: .9rem 1.1rem; border-bottom: 1px solid var(--border); display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .detail-header .title { font-size: 1.05rem; font-weight: 600; flex: 1 1 auto; word-break: break-word; }
  .detail-meta { color: var(--text-dim); font-size: 12px; padding: 0 1.1rem .5rem 1.1rem; border-bottom: 1px solid var(--border); }
  .detail-body { overflow-y: auto; padding: 1rem 1.1rem; flex: 1; min-height: 0; }
  .detail-body section { margin-bottom: 1.5rem; }
  .detail-body h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin: 0 0 .5rem 0; }
  .asking { background: rgba(210,153,34,.08); border: 1px solid rgba(210,153,34,.4); padding: .8rem 1rem; border-radius: 4px; }
  .asking .label { color: var(--waiting); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: .3rem; }
  .report { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; margin-bottom: .7rem; overflow: hidden; }
  .report.unread { border-left: 3px solid var(--accent); }
  .report-header { display: flex; align-items: center; gap: .5rem; padding: .55rem .8rem; cursor: pointer; user-select: none; }
  .report-header:hover { background: var(--panel-2); }
  .report-chevron { color: var(--text-dim); width: 1ch; display: inline-block; transition: transform .12s ease; }
  .report.collapsed .report-chevron { transform: rotate(-90deg); }
  .report-filename { color: var(--accent); font-size: 12px; font-family: ui-monospace, monospace; flex: 1; }
  .report-status { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: .05rem .4rem; border-radius: 3px; }
  .report-status.unread { background: rgba(88,166,255,.18); color: var(--accent); }
  .report-status.read { background: rgba(139,149,163,.16); color: var(--text-dim); }
  .report-toggle-read { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: .15rem .55rem; font-size: 11px; border-radius: 3px; cursor: pointer; }
  .report-toggle-read:hover { color: var(--text); background: var(--panel-2); }
  .report-body { padding: .55rem .9rem .7rem .9rem; border-top: 1px solid var(--border); }
  .report.collapsed .report-body { display: none; }
  .report-empty { color: var(--text-dim); font-style: italic; }
  .tabs { display: flex; gap: .25rem; padding: 0 1.1rem; border-bottom: 1px solid var(--border); background: var(--panel); }
  .tab-btn { background: transparent; border: 1px solid transparent; border-bottom: none; padding: .45rem .9rem; border-radius: 4px 4px 0 0; color: var(--text-dim); cursor: pointer; }
  .tab-btn.active { background: var(--bg); border-color: var(--border); color: var(--text); margin-bottom: -1px; }
  .tab-btn:hover { color: var(--text); }
  .diff-base-toggle { margin-left: auto; padding: .35rem .5rem; font-size: 12px; color: var(--text-dim); }
  .diff-empty { color: var(--text-dim); font-style: italic; padding: 1rem 0; }
  .diff-file { margin-bottom: 1.2rem; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .diff-file-header { background: var(--panel-2); padding: .4rem .7rem; font-family: ui-monospace, monospace; font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: .5rem; cursor: pointer; user-select: none; }
  .diff-file-header:hover { background: #232b3a; }
  .diff-chevron { color: var(--text-dim); width: 1ch; display: inline-block; transition: transform .12s ease; }
  .diff-file.collapsed .diff-chevron { transform: rotate(-90deg); }
  .diff-file.collapsed .diff-file-body { display: none; }
  .diff-summary { margin-left: auto; font-size: 11px; color: var(--text-dim); font-family: ui-monospace, monospace; }
  .diff-summary .add-count { color: var(--running); margin-right: .35rem; }
  .diff-summary .remove-count { color: var(--crashed); }
  .diff-tool-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: .15rem .55rem; font-size: 11px; border-radius: 3px; margin-right: .25rem; cursor: pointer; }
  .diff-tool-btn:hover { color: var(--text); background: var(--panel-2); }
  .diff-hunk { background: rgba(88,166,255,.05); padding: .15rem .7rem; font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-dim); }
  .diff-line { display: grid; grid-template-columns: 4ch 4ch 1fr; font-family: ui-monospace, monospace; font-size: 12.5px; line-height: 1.5; }
  .diff-line[data-anchor-line] { cursor: pointer; }
  .diff-line[data-anchor-line]:hover { background: rgba(88,166,255,.08); }
  .diff-line.selected { background: rgba(88,166,255,.18) !important; }
  .diff-line .ln { text-align: right; padding-right: .5rem; color: var(--text-dim); user-select: none; }
  .diff-line.add { background: rgba(63,185,80,.08); }
  .diff-line.remove { background: rgba(248,81,73,.08); }
  .diff-line .body { white-space: pre; padding-right: .7rem; overflow-x: auto; }
  .diff-line.add .body::before { content: "+"; color: var(--running); }
  .diff-line.remove .body::before { content: "-"; color: var(--crashed); }
  .diff-line.context .body::before { content: " "; }
  .md { word-break: break-word; }
  .md > * { margin: 0; }
  .md > * + * { margin-top: .55rem; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-weight: 600; line-height: 1.3; color: var(--text); }
  .md h1 { font-size: 1.35rem; }
  .md h2 { font-size: 1.15rem; }
  .md h3 { font-size: 1.02rem; }
  .md h4, .md h5, .md h6 { font-size: .95rem; }
  .md h2, .md h3 { border-bottom: 1px solid var(--border); padding-bottom: .25rem; }
  .md p { line-height: 1.55; white-space: pre-wrap; }
  .md ul, .md ol { padding-left: 1.4rem; line-height: 1.55; }
  .md li + li { margin-top: .2rem; }
  .md blockquote { border-left: 3px solid var(--border); color: var(--text-dim); padding: .15rem .8rem; }
  .md blockquote p { white-space: pre-wrap; }
  .md hr { border: none; border-top: 1px solid var(--border); }
  .md code { background: rgba(110,118,129,.18); padding: .05rem .35rem; border-radius: 3px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
  .md pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: .55rem .75rem; overflow-x: auto; }
  .md pre code { background: transparent; padding: 0; border-radius: 0; font-size: 12.5px; white-space: pre; display: block; }
  .md a { color: var(--accent); }
  .md [data-anchor-line] { cursor: pointer; border-radius: 3px; padding-left: .25rem; padding-right: .25rem; margin-left: -.25rem; margin-right: -.25rem; transition: background-color .08s ease; }
  .md [data-anchor-line]:hover { background: rgba(88,166,255,.08); }
  .md [data-anchor-line][aria-current="true"] { background: rgba(88,166,255,.18); }
  .anchor-chip { display: inline-flex; align-items: center; gap: .35rem; background: rgba(88,166,255,.15); border: 1px solid rgba(88,166,255,.4); color: var(--accent); padding: .2rem .55rem; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 12px; margin-bottom: .5rem; }
  .anchor-chip button { background: transparent; border: none; color: var(--accent); padding: 0 .2rem; cursor: pointer; font-size: 14px; line-height: 1; }
  .event-row { display: grid; grid-template-columns: 5ch 12rem 8rem 1fr; gap: .5rem; padding: .25rem .5rem; border-bottom: 1px solid var(--border); font-family: ui-monospace, monospace; font-size: 12px; align-items: baseline; }
  .event-row:hover { background: var(--panel); }
  .event-seq { color: var(--text-dim); text-align: right; }
  .event-kind { color: var(--accent); }
  .event-ts { color: var(--text-dim); }
  .event-payload { color: var(--text-dim); white-space: pre-wrap; word-break: break-word; max-height: 8em; overflow: hidden; }
  .event-row.expanded .event-payload { max-height: none; }
  .feedback-form { border-top: 1px solid var(--border); padding: .9rem 1.1rem; background: var(--panel); }
  .feedback-form textarea { margin-bottom: .5rem; }
  .row { display: flex; gap: .5rem; align-items: center; }
  .row .spacer { flex: 1; }
  .danger { color: var(--crashed); border-color: rgba(248,81,73,.5); }
  .danger:hover { background: rgba(248,81,73,.1); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1.2rem; width: min(520px, 90vw); }
  .modal h2 { margin: 0 0 .8rem 0; font-size: 1rem; }
  .hidden { display: none !important; }
  .toast { position: fixed; bottom: 1rem; right: 1rem; background: var(--panel-2); border: 1px solid var(--border); padding: .5rem .8rem; border-radius: 4px; font-size: 13px; }
  .action-output { margin-top: .8rem; }
  .action-output h3 { margin: .6rem 0 .25rem 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); }
  .action-output pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: .55rem .7rem; max-height: 18em; overflow: auto; font-size: 12.5px; }
  .action-output .status-ok { color: var(--running); font-weight: 600; }
  .action-output .status-fail { color: var(--crashed); font-weight: 600; }
  .action-modal { width: min(720px, 92vw); }
  .action-form label { display: block; font-size: 12px; color: var(--text-dim); margin: .5rem 0 .2rem 0; text-transform: uppercase; letter-spacing: .05em; }
  .action-buttons { display: flex; flex-wrap: wrap; gap: .35rem; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>worqload</h1>
      <button id="btnNew">+ New</button>
    </div>
    <div id="sessionList" class="session-list"></div>
  </aside>
  <main id="detail" class="detail">
    <div class="detail-empty" id="detailEmpty">Select a session, or create a new one.</div>
  </main>
</div>

<div id="modal" class="modal-bg hidden">
  <div class="modal">
    <h2>New session</h2>
    <p style="margin:.2em 0 .6em; color:var(--text-dim); font-size:12px">
      The prompt becomes the first user message in a fresh claude session.
    </p>
    <textarea id="modalPrompt" placeholder="What should the agent do?" rows="6"></textarea>
    <div class="row" style="margin-top:.7rem">
      <input id="modalBranch" placeholder="base branch (default: current HEAD)" style="flex:1">
    </div>
    <div class="row" style="margin-top:.7rem">
      <input id="modalBranchName" placeholder="branch name (default: auto-generated)" style="flex:1">
    </div>
    <div class="row" style="margin-top:.7rem">
      <span class="spacer"></span>
      <button id="modalCancel">Cancel</button>
      <button id="modalCreate">Create</button>
    </div>
  </div>
</div>

<div id="actionModal" class="modal-bg hidden">
  <div class="modal action-modal">
    <h2 id="actionModalTitle">Action</h2>
    <p id="actionModalDescription" style="margin:.2em 0 .6em; color:var(--text-dim); font-size:12px"></p>
    <div id="actionModalConfirm" style="display:none; margin:.5rem 0; color:var(--waiting); white-space:pre-wrap"></div>
    <div id="actionModalForm" class="action-form"></div>
    <div id="actionModalOutput" class="action-output hidden"></div>
    <div class="row" style="margin-top:.8rem">
      <span class="spacer"></span>
      <button id="actionModalClose">Close</button>
      <button id="actionModalRun">Run</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module">
import { renderMarkdown } from "/assets/markdown.js";
const $ = sel => document.querySelector(sel);
const state = {
  sessions: [],
  selected: null,        // session id
  detail: null,          // { meta, events }
  reports: [],
  asking: [],
  feedbackHistory: [],
  ws: null,
  lastSeq: 0,
  activeTab: "reports",  // "reports" | "diff"
  diff: "",              // text/plain diff
  diffBase: "session-start",
  anchor: null,          // { path, lineStart, lineEnd } | null
  collapsedFiles: new Set(),  // paths of diff files the user collapsed
  reportToggle: new Map(),    // filename -> true(expanded) | false(collapsed): explicit user override
  actions: [],           // [{ id, label, description?, confirmMessage?, params? }]
  pendingAction: null,   // descriptor currently displayed in action modal
};

function toast(text, ms = 2400) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add("hidden"), ms);
}

async function api(method, path, body) {
  const init = { method, headers: { "content-type": "application/json" } };
  if (body !== undefined) init.body = JSON.stringify(body);
  const res = await fetch(path, init);
  if (!res.ok) throw new Error(`${method} ${path} → ${res.status}: ${await res.text()}`);
  return res.json();
}

async function fetchSessions() {
  const { sessions } = await api("GET", "/sessions");
  state.sessions = sessions;
  renderSessionList();
}

async function fetchActions() {
  try {
    const { actions } = await api("GET", "/actions");
    state.actions = actions;
  } catch {
    state.actions = [];
  }
}

async function selectSession(id) {
  if (state.ws) { state.ws.close(); state.ws = null; }
  state.selected = id;
  state.lastSeq = 0;
  state.reports = [];
  state.asking = [];
  state.detail = null;
  state.collapsedFiles = new Set();
  state.reportToggle = new Map();
  renderSessionList();
  renderDetail();
  if (!id) return;
  await refreshDetail();
  openWs(id);
}

async function refreshDetail() {
  if (!state.selected) return;
  const id = state.selected;
  const [{ meta, events }, reportsRes, askingRes, feedbackRes] = await Promise.all([
    api("GET", `/sessions/${id}`),
    api("GET", `/sessions/${id}/reports`),
    api("GET", `/sessions/${id}/asking`),
    api("GET", `/sessions/${id}/feedback`),
  ]);
  state.detail = { meta, events };
  state.reports = reportsRes.reports;
  state.asking = askingRes.asking;
  state.feedbackHistory = feedbackRes.messages;
  state.lastSeq = events.length > 0 ? events[events.length - 1].seq : 0;
  if (state.activeTab === "diff") await refreshDiff();
  renderDetail();
}

async function refreshDiff() {
  if (!state.selected) return;
  try {
    const res = await fetch(`/sessions/${state.selected}/diff?base=${state.diffBase}`);
    state.diff = res.ok ? await res.text() : "";
  } catch {
    state.diff = "";
  }
}

function openWs(id) {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/sessions/${id}/stream`);
  state.ws = ws;
  ws.addEventListener("open", () => {
    ws.send(JSON.stringify({ type: "subscribe", lastSeq: state.lastSeq }));
  });
  ws.addEventListener("message", async e => {
    let payload; try { payload = JSON.parse(e.data); } catch { return; }
    const ev = payload.event;
    if (!ev || ev.seq <= state.lastSeq) return;
    state.lastSeq = ev.seq;
    if (state.detail) {
      state.detail.events = [...(state.detail.events ?? []), ev];
    }
    if (state.activeTab === "events") renderDetail();
    // For "interesting" events refresh the relevant slice.
    if (ev.kind === "report_submitted" || ev.kind === "report_read" || ev.kind === "report_unread"
        || ev.kind === "feedback_received" || ev.kind === "feedback_fetched"
        || ev.kind === "escalation_requested" || ev.kind === "escalation_resolved"
        || ev.kind === "session_stopped" || ev.kind === "session_crashed") {
      await refreshDetail();
      await fetchSessions();
    }
  });
  ws.addEventListener("close", () => {
    if (state.ws === ws) state.ws = null;
  });
}

function renderSessionList() {
  const root = $("#sessionList");
  if (state.sessions.length === 0) {
    root.innerHTML = `<div style="padding:1rem; color:var(--text-dim)">No sessions yet.</div>`;
    return;
  }
  root.innerHTML = "";
  for (const s of state.sessions) {
    const card = document.createElement("div");
    card.className = "session-card" + (s.id === state.selected ? " active" : "");
    card.innerHTML = `
      <p class="title"><span class="badge badge-${s.status}">${s.status.replace("_", " ")}</span>${escapeHtml(s.title || s.prompt.slice(0, 80))}</p>
      <div class="meta">${escapeHtml(s.baseBranch)} · ${formatRelative(s.createdAt)}</div>
    `;
    card.addEventListener("click", () => selectSession(s.id));
    root.appendChild(card);
  }
}

function renderDetail() {
  const root = $("#detail");
  // preserve any in-progress feedback text across re-renders
  const preservedFeedback = ($("#feedbackInput")?.value) ?? "";
  if (!state.selected || !state.detail) {
    root.innerHTML = `<div class="detail-empty">Select a session, or create a new one.</div>`;
    return;
  }
  const m = state.detail.meta;
  const askingHtml = state.asking.length > 0
    ? `<section class="asking">
         <div class="label">⚠ Question pending — answer below to resume</div>
         ${state.asking.map(a => `
           <article data-asking="${escapeHtml(a.filename)}" style="margin-top:.6rem">
             <div class="filename">${escapeHtml(a.filename)}</div>
             <div class="md">${renderMarkdown(a.content)}</div>
             <textarea class="ask-answer" rows="3" placeholder="Your answer..." style="margin-top:.4rem"></textarea>
             <div class="row" style="margin-top:.3rem">
               <span class="spacer"></span>
               <button class="ask-resolve">Resolve</button>
             </div>
           </article>
         `).join("")}
       </section>`
    : "";
  const reportsHtml = state.reports.length > 0
    ? state.reports.slice().reverse().map(r => {
        const path = `./.worqload-reports/${r.filename}`;
        const body = renderMarkdown(r.content, { anchorPath: path, anchor: state.anchor });
        const expanded = isReportExpanded(r);
        const statusLabel = r.read ? "read" : "unread";
        const toggleLabel = r.read ? "未読にする" : "既読にする";
        const escapedFilename = escapeHtml(r.filename);
        return `
          <article class="report ${r.read ? "" : "unread"} ${expanded ? "" : "collapsed"}" data-report-filename="${escapedFilename}">
            <div class="report-header" data-report-toggle="${escapedFilename}">
              <span class="report-chevron">▾</span>
              <span class="report-filename">${escapedFilename}</span>
              <span class="report-status ${statusLabel}">${statusLabel}</span>
              <button type="button" class="report-toggle-read" data-report-mark="${escapedFilename}" data-report-mark-to="${r.read ? "unread" : "read"}">${toggleLabel}</button>
            </div>
            <div class="report-body">
              <div class="md">${body}</div>
            </div>
          </article>
        `;
      }).join("")
    : `<div class="report-empty">No reports yet. The agent submits reports at progress checkpoints.</div>`;

  const feedbackHtml = state.feedbackHistory.length > 0
    ? state.feedbackHistory.map(f => `
        <article class="report">
          <div class="filename">
            ${escapeHtml(f.filename)}
            <span class="badge badge-${f.status === "unread" ? "waiting_human" : "stopped"}" style="margin-left:.4rem">${f.status}</span>
          </div>
          <div class="md">${renderMarkdown(f.content)}</div>
        </article>
      `).join("")
    : "";

  const isTerminal = m.status === "stopped" || m.status === "crashed";

  const eventCount = state.detail.events?.length ?? 0;
  const tabsHtml = `
    <div class="tabs">
      <button class="tab-btn ${state.activeTab === "reports" ? "active" : ""}" data-tab="reports">Reports</button>
      <button class="tab-btn ${state.activeTab === "diff" ? "active" : ""}" data-tab="diff">Diff</button>
      <button class="tab-btn ${state.activeTab === "events" ? "active" : ""}" data-tab="events">Events <span style="color:var(--text-dim);font-weight:normal">(${eventCount})</span></button>
      ${state.activeTab === "diff" ? `
        <span class="diff-base-toggle">
          <button id="btnExpandAll" type="button" class="diff-tool-btn">Expand all</button>
          <button id="btnCollapseAll" type="button" class="diff-tool-btn">Collapse all</button>
          base:
          <select id="diffBaseSel" style="background:transparent;border:1px solid var(--border);color:var(--text);padding:.1rem .3rem;border-radius:3px">
            <option value="session-start" ${state.diffBase === "session-start" ? "selected" : ""}>session-start</option>
            <option value="base-branch" ${state.diffBase === "base-branch" ? "selected" : ""}>${escapeHtml(m.baseBranch)}</option>
          </select>
        </span>
      ` : ""}
    </div>
  `;

  const tabContent = state.activeTab === "diff" ? renderDiffHtml()
    : state.activeTab === "events" ? renderEventsHtml()
    : reportsHtml;

  const anchorChip = state.anchor
    ? `<div class="anchor-chip">Re: ${escapeHtml(state.anchor.path)}:${state.anchor.lineStart}${state.anchor.lineEnd !== state.anchor.lineStart ? `-${state.anchor.lineEnd}` : ""} <button id="anchorClear" title="clear anchor">×</button></div>`
    : "";

  const actionButtonsHtml = state.actions.map(a => `
    <button class="btn-action" data-action-id="${escapeHtml(a.id)}" title="${escapeHtml(a.description || "")}">${escapeHtml(a.label)}</button>
  `).join("");

  root.innerHTML = `
    <div class="detail-header">
      <div class="title"><span class="badge badge-${m.status}">${m.status.replace("_", " ")}</span>${escapeHtml(m.title || m.prompt.slice(0, 100))}</div>
      <div class="action-buttons">${actionButtonsHtml}</div>
      <button id="btnStop" ${isTerminal ? "disabled" : ""}>Stop</button>
      <button id="btnCancel" class="danger" ${isTerminal ? "disabled" : ""}>Cancel</button>
      <button id="btnArchive" ${isTerminal ? "" : "disabled"}>Archive</button>
    </div>
    <div class="detail-meta">
      base: <code>${escapeHtml(m.baseBranch)}</code>
      ${m.branchName ? `· branch: <code>${escapeHtml(m.branchName)}</code>` : ""}
      · started ${formatRelative(m.createdAt)}
      ${m.endedAt ? ` · ended ${formatRelative(m.endedAt)}` : ""}
      · worktree: <code>${escapeHtml(m.worktreePath)}</code>
    </div>
    ${tabsHtml}
    <div class="detail-body" id="detailBody">
      ${askingHtml}
      ${tabContent}
      ${feedbackHtml ? `<section><h2>Feedback sent</h2>${feedbackHtml}</section>` : ""}
    </div>
    <form class="feedback-form" id="feedbackForm">
      ${anchorChip}
      <textarea id="feedbackInput" placeholder="${state.anchor ? "Comment on the selected lines... (Enter で送信 / Shift+Enter で改行)" : "Plain feedback (picked up at the agent's next turn). Click a diff or report line to anchor. (Enter で送信 / Shift+Enter で改行)"}" rows="3"></textarea>
      <div class="row">
        <span class="spacer"></span>
        <button type="submit" ${isTerminal ? "disabled" : ""}>Send feedback</button>
      </div>
    </form>
  `;
  $("#btnStop").addEventListener("click", () => onStop());
  $("#btnCancel").addEventListener("click", () => onCancel());
  $("#btnArchive").addEventListener("click", () => onArchive());
  document.querySelectorAll(".btn-action").forEach(b => {
    b.addEventListener("click", () => openActionModal(b.getAttribute("data-action-id")));
  });
  $("#feedbackForm").addEventListener("submit", e => {
    e.preventDefault();
    onFeedback();
  });
  bindFeedbackEnterToSubmit($("#feedbackInput"));
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.addEventListener("click", () => switchTab(b.getAttribute("data-tab")));
  });
  const baseSel = document.getElementById("diffBaseSel");
  if (baseSel) baseSel.addEventListener("change", e => onDiffBaseChange(e.target.value));
  const btnExpandAll = document.getElementById("btnExpandAll");
  if (btnExpandAll) btnExpandAll.addEventListener("click", onExpandAllDiffFiles);
  const btnCollapseAll = document.getElementById("btnCollapseAll");
  if (btnCollapseAll) btnCollapseAll.addEventListener("click", onCollapseAllDiffFiles);
  document.querySelectorAll("[data-asking]").forEach(el => {
    const filename = el.getAttribute("data-asking");
    el.querySelector(".ask-resolve").addEventListener("click", () => onResolve(filename, el));
  });
  $("#detailBody").addEventListener("click", onDetailBodyClick);
  if (state.anchor) $("#anchorClear").addEventListener("click", clearAnchor);
  if (preservedFeedback) $("#feedbackInput").value = preservedFeedback;
}

function isAnchored(path, lineNo) {
  if (!state.anchor || state.anchor.path !== path) return false;
  return lineNo >= state.anchor.lineStart && lineNo <= state.anchor.lineEnd;
}

function onDetailBodyClick(e) {
  const markBtn = e.target.closest("[data-report-mark]");
  if (markBtn) {
    e.stopPropagation();
    const filename = markBtn.getAttribute("data-report-mark");
    const to = markBtn.getAttribute("data-report-mark-to");
    onReportMark(filename, to === "read");
    return;
  }
  const reportToggle = e.target.closest("[data-report-toggle]");
  if (reportToggle) {
    const filename = reportToggle.getAttribute("data-report-toggle");
    const report = state.reports.find(r => r.filename === filename);
    const currentlyExpanded = report ? isReportExpanded(report) : true;
    state.reportToggle.set(filename, !currentlyExpanded);
    renderDetail();
    return;
  }
  const toggle = e.target.closest("[data-diff-toggle]");
  if (toggle) {
    const path = toggle.getAttribute("data-diff-toggle");
    if (state.collapsedFiles.has(path)) state.collapsedFiles.delete(path);
    else state.collapsedFiles.add(path);
    renderDetail();
    return;
  }
  onLineClick(e);
}

function isReportExpanded(report) {
  if (state.reportToggle.has(report.filename)) {
    return state.reportToggle.get(report.filename);
  }
  return !report.read;
}

async function onReportMark(filename, read) {
  if (!state.selected) return;
  const verb = read ? "read" : "unread";
  try {
    await api("POST", `/sessions/${state.selected}/reports/${encodeURIComponent(filename)}/${verb}`, {});
    // Drop any explicit toggle so the new default (collapsed when read,
    // expanded when unread) takes effect on the next render.
    state.reportToggle.delete(filename);
    await refreshDetail();
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

function onExpandAllDiffFiles() {
  state.collapsedFiles.clear();
  renderDetail();
}

function onCollapseAllDiffFiles() {
  for (const el of document.querySelectorAll("[data-diff-path]")) {
    const path = el.getAttribute("data-diff-path");
    if (path) state.collapsedFiles.add(path);
  }
  renderDetail();
}

function onLineClick(e) {
  const target = e.target.closest("[data-anchor-line]");
  if (!target) return;
  const path = target.getAttribute("data-anchor-path");
  const lineStart = Number(target.getAttribute("data-anchor-line"));
  const lineEndAttr = target.getAttribute("data-anchor-line-end");
  const lineEnd = lineEndAttr !== null ? Number(lineEndAttr) : lineStart;
  if (!path || !Number.isFinite(lineStart) || !Number.isFinite(lineEnd)) return;
  if (e.shiftKey && state.anchor && state.anchor.path === path) {
    state.anchor = {
      path,
      lineStart: Math.min(state.anchor.lineStart, lineStart),
      lineEnd: Math.max(state.anchor.lineEnd, lineEnd),
    };
  } else {
    state.anchor = { path, lineStart, lineEnd };
  }
  renderDetail();
}

function clearAnchor() {
  state.anchor = null;
  renderDetail();
}

async function switchTab(tab) {
  if (tab === state.activeTab) return;
  state.activeTab = tab;
  if (tab === "diff") await refreshDiff();
  renderDetail();
}

async function onDiffBaseChange(value) {
  state.diffBase = value;
  await refreshDiff();
  renderDetail();
}

function renderEventsHtml() {
  const events = state.detail?.events ?? [];
  if (events.length === 0) {
    return `<div class="diff-empty">No events yet.</div>`;
  }
  return events.slice().reverse().map(e => {
    const payload = JSON.stringify(e.payload);
    const truncated = payload.length > 400 ? payload.slice(0, 400) + " …" : payload;
    return `
      <div class="event-row" data-event-seq="${e.seq}">
        <span class="event-seq">${e.seq}</span>
        <span class="event-kind">${escapeHtml(e.kind)}</span>
        <span class="event-ts">${formatRelative(e.timestamp)}</span>
        <span class="event-payload">${escapeHtml(truncated)}</span>
      </div>
    `;
  }).join("");
}

function parseDiffFiles(text) {
  const files = [];
  let currentFile = null;
  let currentHunk = null;
  for (const raw of text.split("\n")) {
    if (raw.startsWith("diff --git ")) {
      const m = raw.match(/^diff --git a\/.+? b\/(.+)$/);
      currentFile = { path: m ? m[1] : "?", hunks: [], adds: 0, removes: 0 };
      files.push(currentFile);
      currentHunk = null;
      continue;
    }
    if (raw.startsWith("index ") || raw.startsWith("--- ") || raw.startsWith("+++ ") ||
        raw.startsWith("new file mode ") || raw.startsWith("deleted file mode ") ||
        raw.startsWith("rename ") || raw.startsWith("similarity ") || raw.startsWith("dissimilarity ") ||
        raw.startsWith("Binary files ")) {
      continue;
    }
    if (!currentFile) continue;
    if (raw.startsWith("@@")) {
      const m = raw.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      currentHunk = {
        header: raw,
        oldLine: m ? Number(m[1]) : 0,
        newLine: m ? Number(m[2]) : 0,
        lines: [],
      };
      currentFile.hunks.push(currentHunk);
      continue;
    }
    if (!currentHunk) continue;
    currentHunk.lines.push(raw);
    if (raw.startsWith("+")) currentFile.adds++;
    else if (raw.startsWith("-")) currentFile.removes++;
  }
  return files;
}

function renderDiffHtml() {
  if (!state.diff || state.diff.trim() === "") {
    return `<div class="diff-empty">No changes against ${escapeHtml(state.diffBase)} yet.</div>`;
  }
  const files = parseDiffFiles(state.diff);
  const out = [];
  for (const file of files) {
    const collapsed = state.collapsedFiles.has(file.path);
    const escapedPath = escapeHtml(file.path);
    out.push(`<div class="diff-file${collapsed ? " collapsed" : ""}" data-diff-path="${escapedPath}">`);
    out.push(`<div class="diff-file-header" data-diff-toggle="${escapedPath}"><span class="diff-chevron">▾</span><span>${escapedPath}</span><span class="diff-summary"><span class="add-count">+${file.adds}</span><span class="remove-count">−${file.removes}</span></span></div>`);
    out.push(`<div class="diff-file-body">`);
    for (const hunk of file.hunks) {
      out.push(`<div class="diff-hunk">${escapeHtml(hunk.header)}</div>`);
      let hunkOldLine = hunk.oldLine, hunkNewLine = hunk.newLine;
      for (const raw of hunk.lines) {
        let cls = "context", lineNo = hunkNewLine, anchorable = true, body = raw.slice(1);
        if (raw.startsWith("+")) { cls = "add"; lineNo = hunkNewLine; anchorable = true; }
        else if (raw.startsWith("-")) { cls = "remove"; lineNo = hunkOldLine; anchorable = false; }
        else if (raw.startsWith(" ")) { cls = "context"; lineNo = hunkNewLine; anchorable = true; }
        else { cls = "context"; lineNo = 0; anchorable = false; body = raw; }
        const sel = anchorable && isAnchored(file.path, lineNo) ? "selected" : "";
        const dataAttrs = anchorable
          ? `data-anchor-line="${lineNo}" data-anchor-path="${escapedPath}"`
          : "";
        out.push(`<div class="diff-line ${cls} ${sel}" ${dataAttrs}><span class="ln">${cls === "add" ? "" : (cls === "remove" ? hunkOldLine : "")}</span><span class="ln">${cls === "remove" ? "" : hunkNewLine}</span><span class="body">${escapeHtml(body)}</span></div>`);
        if (raw.startsWith("+")) hunkNewLine++;
        else if (raw.startsWith("-")) hunkOldLine++;
        else if (raw.startsWith(" ")) { hunkOldLine++; hunkNewLine++; }
      }
    }
    out.push(`</div></div>`);
  }
  return out.join("");
}

async function onArchive() {
  if (!state.selected) return;
  try {
    await api("POST", `/sessions/${state.selected}/archive`, {});
    const archivedId = state.selected;
    await fetchSessions();
    // Move to first remaining session, or empty pane
    const next = state.sessions.find(s => s.id !== archivedId);
    await selectSession(next ? next.id : null);
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

async function onResolve(filename, articleEl) {
  if (!state.selected) return;
  const text = articleEl.querySelector(".ask-answer").value.trim();
  if (text === "") { toast("answer is required"); return; }
  try {
    await api("POST", `/sessions/${state.selected}/escalations/${encodeURIComponent(filename)}/resolve`, { content: text });
    toast("escalation resolved");
    await refreshDetail();
    await fetchSessions();
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

function bindFeedbackEnterToSubmit(textarea) {
  if (!textarea) return;
  // Track IME composition explicitly. `event.isComposing` and `keyCode === 229`
  // cover most browsers, but on some macOS browsers the commit-Enter keydown
  // fires AFTER compositionend with both flags clear. The explicit flag is the
  // backstop so a confirming Enter does not also submit.
  let composing = false;
  textarea.addEventListener("compositionstart", () => { composing = true; });
  textarea.addEventListener("compositionend", () => { composing = false; });
  textarea.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.shiftKey) return;
    if (composing || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    onFeedback();
  });
}

async function onFeedback() {
  if (!state.selected) return;
  const text = $("#feedbackInput").value.trim();
  if (text === "") return;
  const body = { content: text, slug: state.anchor ? "anchored" : "feedback" };
  if (state.anchor) {
    body.anchor = {
      path: state.anchor.path,
      lineStart: state.anchor.lineStart,
      lineEnd: state.anchor.lineEnd,
    };
  }
  try {
    await api("POST", `/sessions/${state.selected}/feedback`, body);
    $("#feedbackInput").value = "";
    state.anchor = null;
    toast("feedback queued");
    await refreshDetail();
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

async function onStop() {
  if (!state.selected) return;
  if (!confirm("Stop this session? The worktree is preserved.")) return;
  try {
    await api("POST", `/sessions/${state.selected}/stop`, {});
    await refreshDetail();
    await fetchSessions();
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

async function onCancel() {
  if (!state.selected) return;
  if (!confirm("Cancel this session? The worktree will be REMOVED.")) return;
  try {
    await api("POST", `/sessions/${state.selected}/cancel`, {});
    await refreshDetail();
    await fetchSessions();
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

function openModal() {
  $("#modal").classList.remove("hidden");
  $("#modalPrompt").value = "";
  $("#modalBranch").value = "";
  $("#modalBranchName").value = "";
  $("#modalPrompt").focus();
}
function closeModal() { $("#modal").classList.add("hidden"); }

function openActionModal(actionId) {
  const action = state.actions.find(a => a.id === actionId);
  if (!action || !state.selected) return;
  state.pendingAction = action;
  $("#actionModalTitle").textContent = action.label;
  $("#actionModalDescription").textContent = action.description || "";
  const confirmEl = $("#actionModalConfirm");
  if (action.confirmMessage) {
    confirmEl.textContent = action.confirmMessage;
    confirmEl.style.display = "block";
  } else {
    confirmEl.style.display = "none";
  }
  const formEl = $("#actionModalForm");
  formEl.innerHTML = (action.params || []).map(p => {
    const fieldId = `actionParam-${p.name}`;
    if (p.type === "text") {
      return `
        <label for="${fieldId}">${escapeHtml(p.label)}</label>
        <textarea id="${fieldId}" rows="4" placeholder="${escapeHtml(p.placeholder || "")}">${escapeHtml(p.default || "")}</textarea>
      `;
    }
    return `
      <label for="${fieldId}">${escapeHtml(p.label)}</label>
      <input id="${fieldId}" type="text" placeholder="${escapeHtml(p.placeholder || "")}" value="${escapeHtml(p.default || "")}">
    `;
  }).join("");
  $("#actionModalOutput").innerHTML = "";
  $("#actionModalOutput").classList.add("hidden");
  $("#actionModalRun").disabled = false;
  $("#actionModalRun").textContent = "Run";
  $("#actionModal").classList.remove("hidden");
}

function closeActionModal() {
  $("#actionModal").classList.add("hidden");
  state.pendingAction = null;
}

async function runPendingAction() {
  const action = state.pendingAction;
  if (!action || !state.selected) return;
  const params = {};
  for (const p of action.params || []) {
    const el = document.getElementById(`actionParam-${p.name}`);
    if (el) params[p.name] = el.value;
  }
  const runBtn = $("#actionModalRun");
  runBtn.disabled = true;
  runBtn.textContent = "Running…";
  try {
    const res = await fetch(`/sessions/${state.selected}/actions/${encodeURIComponent(action.id)}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ params }),
    });
    const data = await res.json().catch(() => ({}));
    renderActionResult(data, res.status);
  } catch (e) {
    renderActionResult({ ok: false, message: e.message, stdout: "", stderr: "" }, 0);
  } finally {
    runBtn.textContent = "Run again";
    runBtn.disabled = false;
  }
}

function renderActionResult(result, httpStatus) {
  const out = $("#actionModalOutput");
  const ok = !!result.ok;
  const statusLine = ok
    ? `<div class="status-ok">✓ Success (exit ${result.exitCode ?? 0})</div>`
    : `<div class="status-fail">✗ Failed${result.exitCode !== undefined ? ` (exit ${result.exitCode})` : ""}${httpStatus ? `, http ${httpStatus}` : ""}</div>`;
  const messageLine = result.message
    ? `<div style="margin-top:.3rem">${escapeHtml(result.message)}</div>`
    : "";
  const stdout = result.stdout && result.stdout.trim() !== ""
    ? `<h3>stdout</h3><pre>${escapeHtml(result.stdout)}</pre>` : "";
  const stderr = result.stderr && result.stderr.trim() !== ""
    ? `<h3>stderr</h3><pre>${escapeHtml(result.stderr)}</pre>` : "";
  const error = result.error
    ? `<h3>error</h3><pre>${escapeHtml(result.error)}</pre>` : "";
  out.innerHTML = `${statusLine}${messageLine}${stdout}${stderr}${error}`;
  out.classList.remove("hidden");
}

async function createSession() {
  const prompt = $("#modalPrompt").value.trim();
  if (prompt === "") { toast("prompt is required"); return; }
  const baseBranch = $("#modalBranch").value.trim();
  const branchName = $("#modalBranchName").value.trim();
  try {
    const body = { prompt };
    if (baseBranch) body.baseBranch = baseBranch;
    if (branchName) body.branchName = branchName;
    const { meta } = await api("POST", "/sessions", body);
    closeModal();
    await fetchSessions();
    await selectSession(meta.id);
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

function escapeHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function formatRelative(iso) {
  if (!iso) return "";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return `${Math.floor(diff)}s ago`;
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

$("#btnNew").addEventListener("click", openModal);
$("#modalCancel").addEventListener("click", closeModal);
$("#modalCreate").addEventListener("click", createSession);
$("#modalPrompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); createSession(); }
});
$("#actionModalClose").addEventListener("click", closeActionModal);
$("#actionModalRun").addEventListener("click", runPendingAction);

await fetchActions();
await fetchSessions();
// auto-select first session if any
if (state.sessions.length > 0) await selectSession(state.sessions[0].id);

// Refresh relative timestamps in the sidebar every 30s. The detail view is
// only re-rendered in response to events to avoid disturbing the feedback
// textarea while the user is typing.
setInterval(() => renderSessionList(), 30_000);
</script>
</body>
</html>

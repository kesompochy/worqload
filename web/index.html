<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>worqload</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2230;
    --border: #2a313c;
    --text: #d6dee8;
    --text-dim: #8b95a3;
    --accent: #58a6ff;
    --running: #3fb950;
    --waiting: #d29922;
    --stopped: #8b95a3;
    --crashed: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: var(--panel-2); border: 1px solid var(--border); padding: .35rem .8rem; border-radius: 4px; cursor: pointer; }
  button:hover { background: #232b3a; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  textarea, input { background: var(--bg); border: 1px solid var(--border); padding: .4rem .5rem; border-radius: 4px; color: var(--text); width: 100%; }
  textarea { resize: vertical; min-height: 4rem; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .sidebar-header { padding: .75rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h1 { margin: 0; font-size: 1rem; letter-spacing: .04em; color: var(--text-dim); }
  .session-list { overflow-y: auto; flex: 1; }
  .session-card { padding: .75rem; border-bottom: 1px solid var(--border); cursor: pointer; }
  .session-card:hover { background: var(--panel); }
  .session-card.active { background: var(--panel-2); border-left: 3px solid var(--accent); padding-left: calc(.75rem - 3px); }
  .session-card .title { font-weight: 600; margin: 0 0 .2rem 0; word-break: break-word; }
  .session-card .meta { color: var(--text-dim); font-size: 12px; }
  .badge { display: inline-block; padding: .05rem .4rem; border-radius: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-right: .35rem; vertical-align: middle; }
  .badge-running { background: rgba(63,185,80,.15); color: var(--running); }
  .badge-waiting_human { background: rgba(210,153,34,.18); color: var(--waiting); }
  .badge-stopped { background: rgba(139,149,163,.16); color: var(--stopped); }
  .badge-crashed { background: rgba(248,81,73,.18); color: var(--crashed); }
  .detail { display: flex; flex-direction: column; min-height: 0; }
  .detail-empty { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--text-dim); }
  .detail-header { padding: .9rem 1.1rem; border-bottom: 1px solid var(--border); display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .detail-header .title { font-size: 1.05rem; font-weight: 600; flex: 1 1 auto; word-break: break-word; }
  .detail-meta { color: var(--text-dim); font-size: 12px; padding: 0 1.1rem .5rem 1.1rem; border-bottom: 1px solid var(--border); }
  .detail-body { overflow-y: auto; padding: 1rem 1.1rem; flex: 1; min-height: 0; }
  .detail-body section { margin-bottom: 1.5rem; }
  .detail-body h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin: 0 0 .5rem 0; }
  .asking { background: rgba(210,153,34,.08); border: 1px solid rgba(210,153,34,.4); padding: .8rem 1rem; border-radius: 4px; }
  .asking .label { color: var(--waiting); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: .3rem; }
  .report { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: .7rem .9rem; margin-bottom: .7rem; }
  .report .filename { color: var(--accent); font-size: 12px; font-family: ui-monospace, monospace; margin-bottom: .3rem; }
  .report-empty { color: var(--text-dim); font-style: italic; }
  .tabs { display: flex; gap: .25rem; padding: 0 1.1rem; border-bottom: 1px solid var(--border); background: var(--panel); }
  .tab-btn { background: transparent; border: 1px solid transparent; border-bottom: none; padding: .45rem .9rem; border-radius: 4px 4px 0 0; color: var(--text-dim); cursor: pointer; }
  .tab-btn.active { background: var(--bg); border-color: var(--border); color: var(--text); margin-bottom: -1px; }
  .tab-btn:hover { color: var(--text); }
  .diff-base-toggle { margin-left: auto; padding: .35rem .5rem; font-size: 12px; color: var(--text-dim); }
  .diff-empty { color: var(--text-dim); font-style: italic; padding: 1rem 0; }
  .diff-file { margin-bottom: 1.2rem; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .diff-file-header { background: var(--panel-2); padding: .4rem .7rem; font-family: ui-monospace, monospace; font-size: 12px; color: var(--accent); }
  .diff-hunk { background: rgba(88,166,255,.05); padding: .15rem .7rem; font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-dim); }
  .diff-line { display: grid; grid-template-columns: 4ch 4ch 1fr; font-family: ui-monospace, monospace; font-size: 12.5px; line-height: 1.5; }
  .diff-line[data-anchor-line] { cursor: pointer; }
  .diff-line[data-anchor-line]:hover { background: rgba(88,166,255,.08); }
  .diff-line.selected { background: rgba(88,166,255,.18) !important; }
  .diff-line .ln { text-align: right; padding-right: .5rem; color: var(--text-dim); user-select: none; }
  .diff-line.add { background: rgba(63,185,80,.08); }
  .diff-line.remove { background: rgba(248,81,73,.08); }
  .diff-line .body { white-space: pre; padding-right: .7rem; overflow-x: auto; }
  .diff-line.add .body::before { content: "+"; color: var(--running); }
  .diff-line.remove .body::before { content: "-"; color: var(--crashed); }
  .diff-line.context .body::before { content: " "; }
  .report .lines { display: block; }
  .report .ln-row { display: grid; grid-template-columns: 4ch 1fr; cursor: pointer; }
  .report .ln-row:hover { background: rgba(88,166,255,.08); }
  .report .ln-row.selected { background: rgba(88,166,255,.18); }
  .report .ln-row .ln { text-align: right; padding-right: .5rem; color: var(--text-dim); font-family: ui-monospace, monospace; font-size: 12px; user-select: none; }
  .report .ln-row .body { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, monospace; font-size: 13px; }
  .anchor-chip { display: inline-flex; align-items: center; gap: .35rem; background: rgba(88,166,255,.15); border: 1px solid rgba(88,166,255,.4); color: var(--accent); padding: .2rem .55rem; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 12px; margin-bottom: .5rem; }
  .anchor-chip button { background: transparent; border: none; color: var(--accent); padding: 0 .2rem; cursor: pointer; font-size: 14px; line-height: 1; }
  .feedback-form { border-top: 1px solid var(--border); padding: .9rem 1.1rem; background: var(--panel); }
  .feedback-form textarea { margin-bottom: .5rem; }
  .row { display: flex; gap: .5rem; align-items: center; }
  .row .spacer { flex: 1; }
  .danger { color: var(--crashed); border-color: rgba(248,81,73,.5); }
  .danger:hover { background: rgba(248,81,73,.1); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1.2rem; width: min(520px, 90vw); }
  .modal h2 { margin: 0 0 .8rem 0; font-size: 1rem; }
  .hidden { display: none !important; }
  .toast { position: fixed; bottom: 1rem; right: 1rem; background: var(--panel-2); border: 1px solid var(--border); padding: .5rem .8rem; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>worqload</h1>
      <button id="btnNew">+ New</button>
    </div>
    <div id="sessionList" class="session-list"></div>
  </aside>
  <main id="detail" class="detail">
    <div class="detail-empty" id="detailEmpty">Select a session, or create a new one.</div>
  </main>
</div>

<div id="modal" class="modal-bg hidden">
  <div class="modal">
    <h2>New session</h2>
    <p style="margin:.2em 0 .6em; color:var(--text-dim); font-size:12px">
      The prompt becomes the first user message in a fresh claude session.
    </p>
    <textarea id="modalPrompt" placeholder="What should the agent do?" rows="6"></textarea>
    <div class="row" style="margin-top:.7rem">
      <input id="modalBranch" placeholder="base branch (default: current HEAD)" style="flex:1">
    </div>
    <div class="row" style="margin-top:.7rem">
      <span class="spacer"></span>
      <button id="modalCancel">Cancel</button>
      <button id="modalCreate">Create</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module">
const $ = sel => document.querySelector(sel);
const state = {
  sessions: [],
  selected: null,        // session id
  detail: null,          // { meta, events }
  reports: [],
  asking: [],
  feedbackHistory: [],
  ws: null,
  lastSeq: 0,
  activeTab: "reports",  // "reports" | "diff"
  diff: "",              // text/plain diff
  diffBase: "session-start",
  anchor: null,          // { path, lineStart, lineEnd } | null
};

function toast(text, ms = 2400) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add("hidden"), ms);
}

async function api(method, path, body) {
  const init = { method, headers: { "content-type": "application/json" } };
  if (body !== undefined) init.body = JSON.stringify(body);
  const res = await fetch(path, init);
  if (!res.ok) throw new Error(`${method} ${path} → ${res.status}: ${await res.text()}`);
  return res.json();
}

async function fetchSessions() {
  const { sessions } = await api("GET", "/sessions");
  state.sessions = sessions;
  renderSessionList();
}

async function selectSession(id) {
  if (state.ws) { state.ws.close(); state.ws = null; }
  state.selected = id;
  state.lastSeq = 0;
  state.reports = [];
  state.asking = [];
  state.detail = null;
  renderSessionList();
  renderDetail();
  if (!id) return;
  await refreshDetail();
  openWs(id);
}

async function refreshDetail() {
  if (!state.selected) return;
  const id = state.selected;
  const [{ meta, events }, reportsRes, askingRes, feedbackRes] = await Promise.all([
    api("GET", `/sessions/${id}`),
    api("GET", `/sessions/${id}/reports`),
    api("GET", `/sessions/${id}/asking`),
    api("GET", `/sessions/${id}/feedback`),
  ]);
  state.detail = { meta, events };
  state.reports = reportsRes.reports;
  state.asking = askingRes.asking;
  state.feedbackHistory = feedbackRes.messages;
  state.lastSeq = events.length > 0 ? events[events.length - 1].seq : 0;
  if (state.activeTab === "diff") await refreshDiff();
  renderDetail();
}

async function refreshDiff() {
  if (!state.selected) return;
  try {
    const res = await fetch(`/sessions/${state.selected}/diff?base=${state.diffBase}`);
    state.diff = res.ok ? await res.text() : "";
  } catch {
    state.diff = "";
  }
}

function openWs(id) {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/sessions/${id}/stream`);
  state.ws = ws;
  ws.addEventListener("open", () => {
    ws.send(JSON.stringify({ type: "subscribe", lastSeq: state.lastSeq }));
  });
  ws.addEventListener("message", async e => {
    let payload; try { payload = JSON.parse(e.data); } catch { return; }
    const ev = payload.event;
    if (!ev || ev.seq <= state.lastSeq) return;
    state.lastSeq = ev.seq;
    // For "interesting" events refresh the relevant slice.
    if (ev.kind === "report_submitted" || ev.kind === "feedback_received" || ev.kind === "feedback_fetched"
        || ev.kind === "escalation_requested" || ev.kind === "escalation_resolved"
        || ev.kind === "session_stopped" || ev.kind === "session_crashed") {
      await refreshDetail();
      await fetchSessions();
    }
  });
  ws.addEventListener("close", () => {
    if (state.ws === ws) state.ws = null;
  });
}

function renderSessionList() {
  const root = $("#sessionList");
  if (state.sessions.length === 0) {
    root.innerHTML = `<div style="padding:1rem; color:var(--text-dim)">No sessions yet.</div>`;
    return;
  }
  root.innerHTML = "";
  for (const s of state.sessions) {
    const card = document.createElement("div");
    card.className = "session-card" + (s.id === state.selected ? " active" : "");
    card.innerHTML = `
      <p class="title"><span class="badge badge-${s.status}">${s.status.replace("_", " ")}</span>${escapeHtml(s.title || s.prompt.slice(0, 80))}</p>
      <div class="meta">${escapeHtml(s.baseBranch)} · ${formatRelative(s.createdAt)}</div>
    `;
    card.addEventListener("click", () => selectSession(s.id));
    root.appendChild(card);
  }
}

function renderDetail() {
  const root = $("#detail");
  // preserve any in-progress feedback text across re-renders
  const preservedFeedback = ($("#feedbackInput")?.value) ?? "";
  if (!state.selected || !state.detail) {
    root.innerHTML = `<div class="detail-empty">Select a session, or create a new one.</div>`;
    return;
  }
  const m = state.detail.meta;
  const askingHtml = state.asking.length > 0
    ? `<section class="asking">
         <div class="label">⚠ Question pending — answer below to resume</div>
         ${state.asking.map(a => `
           <article data-asking="${escapeHtml(a.filename)}" style="margin-top:.6rem">
             <div class="filename">${escapeHtml(a.filename)}</div>
             <pre>${escapeHtml(a.content)}</pre>
             <textarea class="ask-answer" rows="3" placeholder="Your answer..." style="margin-top:.4rem"></textarea>
             <div class="row" style="margin-top:.3rem">
               <span class="spacer"></span>
               <button class="ask-resolve">Resolve</button>
             </div>
           </article>
         `).join("")}
       </section>`
    : "";
  const reportsHtml = state.reports.length > 0
    ? state.reports.map(r => {
        const path = `./.worqload-reports/${r.filename}`;
        const lines = r.content.split("\n");
        const rows = lines.map((line, i) => {
          const lineNo = i + 1;
          const sel = isAnchored(path, lineNo) ? "selected" : "";
          return `<div class="ln-row ${sel}" data-anchor-line="${lineNo}" data-anchor-path="${escapeHtml(path)}"><span class="ln">${lineNo}</span><span class="body">${escapeHtml(line) || "&nbsp;"}</span></div>`;
        }).join("");
        return `
          <article class="report">
            <div class="filename">${escapeHtml(r.filename)}</div>
            <div class="lines">${rows}</div>
          </article>
        `;
      }).join("")
    : `<div class="report-empty">No reports yet. The agent submits reports at progress checkpoints.</div>`;

  const feedbackHtml = state.feedbackHistory.length > 0
    ? state.feedbackHistory.map(f => `
        <article class="report">
          <div class="filename">
            ${escapeHtml(f.filename)}
            <span class="badge badge-${f.status === "unread" ? "waiting_human" : "stopped"}" style="margin-left:.4rem">${f.status}</span>
          </div>
          <pre>${escapeHtml(f.content)}</pre>
        </article>
      `).join("")
    : "";

  const isTerminal = m.status === "stopped" || m.status === "crashed";

  const tabsHtml = `
    <div class="tabs">
      <button class="tab-btn ${state.activeTab === "reports" ? "active" : ""}" data-tab="reports">Reports</button>
      <button class="tab-btn ${state.activeTab === "diff" ? "active" : ""}" data-tab="diff">Diff</button>
      ${state.activeTab === "diff" ? `
        <span class="diff-base-toggle">
          base:
          <select id="diffBaseSel" style="background:transparent;border:1px solid var(--border);color:var(--text);padding:.1rem .3rem;border-radius:3px">
            <option value="session-start" ${state.diffBase === "session-start" ? "selected" : ""}>session-start</option>
            <option value="base-branch" ${state.diffBase === "base-branch" ? "selected" : ""}>${escapeHtml(m.baseBranch)}</option>
          </select>
        </span>
      ` : ""}
    </div>
  `;

  const tabContent = state.activeTab === "diff" ? renderDiffHtml() : reportsHtml;

  const anchorChip = state.anchor
    ? `<div class="anchor-chip">Re: ${escapeHtml(state.anchor.path)}:${state.anchor.lineStart}${state.anchor.lineEnd !== state.anchor.lineStart ? `-${state.anchor.lineEnd}` : ""} <button id="anchorClear" title="clear anchor">×</button></div>`
    : "";

  root.innerHTML = `
    <div class="detail-header">
      <div class="title"><span class="badge badge-${m.status}">${m.status.replace("_", " ")}</span>${escapeHtml(m.title || m.prompt.slice(0, 100))}</div>
      <button id="btnStop" ${isTerminal ? "disabled" : ""}>Stop</button>
      <button id="btnCancel" class="danger" ${isTerminal ? "disabled" : ""}>Cancel</button>
      <button id="btnArchive" ${isTerminal ? "" : "disabled"}>Archive</button>
    </div>
    <div class="detail-meta">
      branch: <code>${escapeHtml(m.baseBranch)}</code> · started ${formatRelative(m.createdAt)}
      ${m.endedAt ? ` · ended ${formatRelative(m.endedAt)}` : ""}
      · worktree: <code>${escapeHtml(m.worktreePath)}</code>
    </div>
    ${tabsHtml}
    <div class="detail-body" id="detailBody">
      ${askingHtml}
      ${tabContent}
      ${feedbackHtml ? `<section><h2>Feedback sent</h2>${feedbackHtml}</section>` : ""}
    </div>
    <form class="feedback-form" id="feedbackForm">
      ${anchorChip}
      <textarea id="feedbackInput" placeholder="${state.anchor ? "Comment on the selected lines..." : "Plain feedback (picked up at the agent's next turn). Click a diff or report line to anchor."}" rows="3"></textarea>
      <div class="row">
        <span class="spacer"></span>
        <button type="submit" ${isTerminal ? "disabled" : ""}>Send feedback</button>
      </div>
    </form>
  `;
  $("#btnStop").addEventListener("click", () => onStop());
  $("#btnCancel").addEventListener("click", () => onCancel());
  $("#btnArchive").addEventListener("click", () => onArchive());
  $("#feedbackForm").addEventListener("submit", e => {
    e.preventDefault();
    onFeedback();
  });
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.addEventListener("click", () => switchTab(b.getAttribute("data-tab")));
  });
  const baseSel = document.getElementById("diffBaseSel");
  if (baseSel) baseSel.addEventListener("change", e => onDiffBaseChange(e.target.value));
  document.querySelectorAll("[data-asking]").forEach(el => {
    const filename = el.getAttribute("data-asking");
    el.querySelector(".ask-resolve").addEventListener("click", () => onResolve(filename, el));
  });
  $("#detailBody").addEventListener("click", onLineClick);
  if (state.anchor) $("#anchorClear").addEventListener("click", clearAnchor);
  if (preservedFeedback) $("#feedbackInput").value = preservedFeedback;
}

function isAnchored(path, lineNo) {
  if (!state.anchor || state.anchor.path !== path) return false;
  return lineNo >= state.anchor.lineStart && lineNo <= state.anchor.lineEnd;
}

function onLineClick(e) {
  const target = e.target.closest("[data-anchor-line]");
  if (!target) return;
  const path = target.getAttribute("data-anchor-path");
  const line = Number(target.getAttribute("data-anchor-line"));
  if (!path || !Number.isFinite(line)) return;
  if (e.shiftKey && state.anchor && state.anchor.path === path) {
    state.anchor = {
      path,
      lineStart: Math.min(state.anchor.lineStart, line),
      lineEnd: Math.max(state.anchor.lineStart, line),
    };
  } else {
    state.anchor = { path, lineStart: line, lineEnd: line };
  }
  renderDetail();
}

function clearAnchor() {
  state.anchor = null;
  renderDetail();
}

async function switchTab(tab) {
  if (tab === state.activeTab) return;
  state.activeTab = tab;
  if (tab === "diff") await refreshDiff();
  renderDetail();
}

async function onDiffBaseChange(value) {
  state.diffBase = value;
  await refreshDiff();
  renderDetail();
}

function renderDiffHtml() {
  if (!state.diff || state.diff.trim() === "") {
    return `<div class="diff-empty">No changes against ${escapeHtml(state.diffBase)} yet.</div>`;
  }
  const out = [];
  let currentFile = null, hunkOldLine = 0, hunkNewLine = 0;
  let openFile = false;
  for (const raw of state.diff.split("\n")) {
    if (raw.startsWith("diff --git ")) {
      if (openFile) out.push("</div>");
      const m = raw.match(/^diff --git a\/.+? b\/(.+)$/);
      currentFile = m ? m[1] : "?";
      out.push(`<div class="diff-file"><div class="diff-file-header">${escapeHtml(currentFile)}</div>`);
      openFile = true;
      continue;
    }
    if (raw.startsWith("index ") || raw.startsWith("--- ") || raw.startsWith("+++ ") ||
        raw.startsWith("new file mode ") || raw.startsWith("deleted file mode ") ||
        raw.startsWith("rename ") || raw.startsWith("similarity ") || raw.startsWith("dissimilarity ") ||
        raw.startsWith("Binary files ")) {
      continue;
    }
    if (raw.startsWith("@@")) {
      const m = raw.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (m) { hunkOldLine = Number(m[1]); hunkNewLine = Number(m[2]); }
      out.push(`<div class="diff-hunk">${escapeHtml(raw)}</div>`);
      continue;
    }
    if (raw === "" && !openFile) continue;
    let cls = "context", lineNo = hunkNewLine, anchorable = true, body = raw.slice(1);
    if (raw.startsWith("+")) { cls = "add"; lineNo = hunkNewLine; anchorable = true; }
    else if (raw.startsWith("-")) { cls = "remove"; lineNo = hunkOldLine; anchorable = false; }
    else if (raw.startsWith(" ")) { cls = "context"; lineNo = hunkNewLine; anchorable = true; }
    else { cls = "context"; lineNo = 0; anchorable = false; body = raw; }
    const sel = anchorable && currentFile && isAnchored(currentFile, lineNo) ? "selected" : "";
    const dataAttrs = anchorable && currentFile
      ? `data-anchor-line="${lineNo}" data-anchor-path="${escapeHtml(currentFile)}"`
      : "";
    out.push(`<div class="diff-line ${cls} ${sel}" ${dataAttrs}><span class="ln">${cls === "add" ? "" : (cls === "remove" ? hunkOldLine : "")}</span><span class="ln">${cls === "remove" ? "" : hunkNewLine}</span><span class="body">${escapeHtml(body)}</span></div>`);
    if (raw.startsWith("+")) hunkNewLine++;
    else if (raw.startsWith("-")) hunkOldLine++;
    else if (raw.startsWith(" ")) { hunkOldLine++; hunkNewLine++; }
  }
  if (openFile) out.push("</div>");
  return out.join("");
}

async function onArchive() {
  if (!state.selected) return;
  try {
    await api("POST", `/sessions/${state.selected}/archive`, {});
    const archivedId = state.selected;
    await fetchSessions();
    // Move to first remaining session, or empty pane
    const next = state.sessions.find(s => s.id !== archivedId);
    await selectSession(next ? next.id : null);
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

async function onResolve(filename, articleEl) {
  if (!state.selected) return;
  const text = articleEl.querySelector(".ask-answer").value.trim();
  if (text === "") { toast("answer is required"); return; }
  try {
    await api("POST", `/sessions/${state.selected}/escalations/${encodeURIComponent(filename)}/resolve`, { content: text });
    toast("escalation resolved");
    await refreshDetail();
    await fetchSessions();
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

async function onFeedback() {
  if (!state.selected) return;
  const text = $("#feedbackInput").value.trim();
  if (text === "") return;
  const body = { content: text, slug: state.anchor ? "anchored" : "feedback" };
  if (state.anchor) {
    body.anchor = {
      path: state.anchor.path,
      lineStart: state.anchor.lineStart,
      lineEnd: state.anchor.lineEnd,
    };
  }
  try {
    await api("POST", `/sessions/${state.selected}/feedback`, body);
    $("#feedbackInput").value = "";
    state.anchor = null;
    toast("feedback queued");
    await refreshDetail();
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

async function onStop() {
  if (!state.selected) return;
  if (!confirm("Stop this session? The worktree is preserved.")) return;
  try {
    await api("POST", `/sessions/${state.selected}/stop`, {});
    await refreshDetail();
    await fetchSessions();
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

async function onCancel() {
  if (!state.selected) return;
  if (!confirm("Cancel this session? The worktree will be REMOVED.")) return;
  try {
    await api("POST", `/sessions/${state.selected}/cancel`, {});
    await refreshDetail();
    await fetchSessions();
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

function openModal() {
  $("#modal").classList.remove("hidden");
  $("#modalPrompt").value = "";
  $("#modalBranch").value = "";
  $("#modalPrompt").focus();
}
function closeModal() { $("#modal").classList.add("hidden"); }

async function createSession() {
  const prompt = $("#modalPrompt").value.trim();
  if (prompt === "") { toast("prompt is required"); return; }
  const baseBranch = $("#modalBranch").value.trim();
  try {
    const body = { prompt };
    if (baseBranch) body.baseBranch = baseBranch;
    const { meta } = await api("POST", "/sessions", body);
    closeModal();
    await fetchSessions();
    await selectSession(meta.id);
  } catch (e) {
    toast(`failed: ${e.message}`);
  }
}

function escapeHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function formatRelative(iso) {
  if (!iso) return "";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return `${Math.floor(diff)}s ago`;
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

$("#btnNew").addEventListener("click", openModal);
$("#modalCancel").addEventListener("click", closeModal);
$("#modalCreate").addEventListener("click", createSession);
$("#modalPrompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); createSession(); }
});

await fetchSessions();
// auto-select first session if any
if (state.sessions.length > 0) await selectSession(state.sessions[0].id);

// Refresh relative timestamps in the sidebar every 30s. The detail view is
// only re-rendered in response to events to avoid disturbing the feedback
// textarea while the user is typing.
setInterval(() => renderSessionList(), 30_000);
</script>
</body>
</html>
